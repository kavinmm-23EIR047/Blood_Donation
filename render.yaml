services:
  - type: web
    name: poongurichi-blood-network-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PASSCODE
        sync: false
      - key: CLIENT_ORIGIN
        value: https://blood-donation-ten-delta.vercel.app
